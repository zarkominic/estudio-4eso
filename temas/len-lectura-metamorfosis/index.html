  <h1>La metamorfosis</h1>

<script>window.LIBRO = {"id":"len-lectura-metamorfosis","titulo":"La metamorfosis","autor":"Franz Kafka","preguntas":[{"id":"m001","cat":"Autor y contexto","q":"¿En qué ciudad nació Franz Kafka?","o":["Praga","Viena","Berlín","Budapest"],"a":0,"w":"Kafka nació en Praga en 1883, entonces parte del Imperio austrohúngaro, y vivió allí casi toda su vida."},{"id":"m002","cat":"Autor y contexto","q":"¿En qué lengua escribió Kafka sus obras?","o":["En checo","En yidis","En hebreo","En alemán"],"a":3,"w":"Aunque en Praga también se hablaba checo, Kafka escribió en alemán."},{"id":"m003","cat":"Autor y contexto","q":"¿Cuál de estas descripciones corresponde a Franz Kafka y a su familia?","o":["Aristócratas checos de religión católica y lengua checa","Campesinos eslovacos de religión protestante y lengua húngara","Diplomáticos alemanes de paso por Praga, de religión luterana","Judíos de lengua alemana en una ciudad de mayoría checa"],"a":3,"w":"Kafka procedía de una familia judía de lengua alemana en Praga, una ciudad de mayoría checa."},{"id":"m004","cat":"Autor y contexto","q":"¿En qué año se publicó La metamorfosis?","o":["1902","1924","1938","1915"],"a":3,"w":"La novela corta se publicó en 1915, primero en una revista y después en forma de libro."},{"id":"m005","cat":"Autor y contexto","q":"¿A qué imperio pertenecía Praga durante la vida de Kafka?","o":["Al Imperio ruso de los zares","Al Imperio austrohúngaro","Al Imperio otomano de Turquía","Al Imperio alemán de Prusia"],"a":1,"w":"Praga formaba parte del Imperio austrohúngaro, que desapareció tras la Primera Guerra Mundial."},{"id":"m006","cat":"Autor y contexto","q":"¿Qué estudió Kafka en la universidad?","o":["Medicina","Derecho","Arquitectura","Magisterio"],"a":1,"w":"Kafka se doctoró en Derecho por la Universidad alemana de Praga en 1906."},{"id":"m007","cat":"Autor y contexto","q":"¿En qué tipo de empresas trabajó Kafka para ganarse la vida?","o":["En editoriales de Praga","En un banco de Viena","En una fábrica de telas","En compañías de seguros"],"a":3,"w":"Kafka trabajó en empresas de seguros y escribía en su tiempo libre."},{"id":"m008","cat":"Autor y contexto","q":"¿De qué enfermedad murió Kafka en 1924?","o":["De cólera, en una epidemia","De fiebre tifoidea","De tuberculosis","De una infección de oído"],"a":2,"w":"Kafka murió de tuberculosis, que afectó a sus pulmones y, al final, a su laringe."},{"id":"m009","cat":"Autor y contexto","q":"¿De qué trata principalmente la Carta al padre de Kafka?","o":["De los motivos que tenía para querer emigrar a América y dejar su trabajo","De su opinión sobre la dureza del trabajo en las compañías de seguros","De sus proyectos para fundar una revista literaria con sus amigos","De su difícil relación con su padre, un hombre autoritario"],"a":3,"w":"En la Carta al padre, Kafka reflexiona sobre el miedo y la distancia que sentía hacia Hermann Kafka, su padre."},{"id":"m010","cat":"Autor y contexto","q":"¿Qué se cuenta en la novela El proceso, de Kafka?","o":["Un hombre es detenido y juzgado sin saber de qué se le acusa","Un abogado investiga un crimen cometido en un pueblo de montaña","Un juez corrupto es descubierto por un periodista y encarcelado","Un joven emigrante viaja a América para hacer fortuna"],"a":0,"w":"El protagonista, Josef K., es arrestado y procesado sin conocer su delito, un caso típico del mundo «kafkiano»."},{"id":"m011","cat":"Autor y contexto","q":"¿Qué intenta conseguir el protagonista de El castillo, de Kafka?","o":["Ser admitido por las autoridades del castillo, sin lograrlo nunca","Heredar el castillo de un tío rico y establecerse en el pueblo","Escapar de una prisión que está situada dentro del castillo","Casarse con la hija del conde y vivir para siempre en palacio"],"a":0,"w":"El agrimensor K. trata en vano de ser reconocido por las autoridades del castillo, que nunca le reciben."},{"id":"m012","cat":"Autor y contexto","q":"¿Quién fue Max Brod en relación con Kafka?","o":["Su editor, que rechazó La metamorfosis por considerarla demasiado extraña","Su profesor de Derecho en Praga, que le consiguió su primer empleo","Su jefe en la compañía de seguros, que descubrió sus escritos","Un amigo que publicó sus obras tras su muerte, aunque él pidió destruirlas"],"a":3,"w":"Max Brod, amigo de Kafka, no cumplió su deseo de quemar los manuscritos y gracias a eso conocemos El proceso o El castillo."},{"id":"m013","cat":"Autor y contexto","q":"¿Qué significa hoy el adjetivo «kafkiano»?","o":["Elegante y refinada, propia de la alta sociedad","Alegre, llena de optimismo y buenas noticias","Relacionada con los viajes y el comercio","Dicho de una situación, absurda y angustiosa"],"a":3,"w":"«Kafkiano» se aplica a situaciones absurdas y angustiosas, como las de las obras de Kafka."},{"id":"m014","cat":"Autor y contexto","q":"¿Con qué corrientes se relaciona más a menudo la obra de Kafka?","o":["Con el expresionismo y la literatura del absurdo","Con el Romanticismo y la poesía lírica del siglo XIX","Con el Barroco y el teatro del Siglo de Oro español","Con el realismo costumbrista y la novela por entregas"],"a":0,"w":"La obra de Kafka se asocia al expresionismo y a la literatura del absurdo del siglo XX."},{"id":"m015","cat":"Autor y contexto","q":"¿Cómo se titula La metamorfosis en su lengua original?","o":["Das Schloss","Der Prozess","Die Verwandlung","Das Urteil"],"a":2,"w":"«Die Verwandlung» significa «La transformación»; Das Schloss es El castillo, Der Prozess es El proceso y Das Urteil, La condena."},{"id":"m016","cat":"Autor y contexto","q":"¿Cómo era Hermann Kafka, el padre del escritor?","o":["Un profesor de instituto muy dulce y comprensivo con sus hijos","Un militar austriaco de carácter tranquilo que murió muy joven","Un comerciante de carácter fuerte y autoritario","Un poeta bondadoso que animó siempre a su hijo a escribir"],"a":2,"w":"Kafka sufrió el carácter dominante de su padre, comerciante, y esa relación aparece muchas veces en su obra."},{"id":"m017","cat":"Autor y contexto","q":"¿Cuál de estas obras de Kafka se publicó después de su muerte?","o":["El proceso","La metamorfosis","La condena","Contemplación"],"a":0,"w":"El proceso apareció en 1925, un año después de la muerte de Kafka; los otros tres títulos se publicaron en vida del autor."},{"id":"m018","cat":"Autor y contexto","q":"¿Qué pidió Kafka sobre sus manuscritos inéditos?","o":["Que se publicaran de inmediato en una edición de lujo","Que se donaran a la Universidad de Praga","Que se tradujeran al checo","Que se destruyeran tras su muerte"],"a":3,"w":"Kafka quería que se destruyeran sus escritos, pero su amigo Max Brod decidió publicarlos."},{"id":"m019","cat":"Autor y contexto","q":"¿Cuántos años tenía Kafka cuando murió?","o":["40 años","28 años","55 años","71 años"],"a":0,"w":"Nació el 3 de julio de 1883 y murió el 3 de junio de 1924, por lo que tenía cuarenta años."},{"id":"m020","cat":"Autor y contexto","q":"Además del alemán, ¿qué otra lengua se hablaba en el entorno de Kafka en Praga?","o":["El polaco","El italiano","El ruso","El checo"],"a":3,"w":"Kafka creció entre el alemán y el checo, aunque eligió el alemán para escribir."},{"id":"m021","cat":"Autor y contexto","q":"¿Qué extensión tiene La metamorfosis?","o":["Es una novela de más de mil páginas dividida en diez libros","Es un poema narrativo en verso dividido en cantos","Es una novela corta dividida en tres partes","Es una obra de teatro en cinco actos"],"a":2,"w":"La metamorfosis es un relato breve, de unas setenta páginas, dividido en tres partes."},{"id":"m022","cat":"Autor y contexto","q":"¿Qué tema es habitual en la obra de Kafka?","o":["Las aventuras heroicas de caballeros medievales en tierras lejanas","El individuo desamparado ante poderes y situaciones que no comprende","La celebración de la vida tranquila y feliz en el campo","Las hazañas militares del Imperio austrohúngaro en la guerra"],"a":1,"w":"En sus relatos y novelas Kafka muestra a personas solas y angustiadas ante autoridades o sucesos absurdos."},{"id":"m023","cat":"Parte I","q":"¿Qué descubre Gregor Samsa al despertar al comienzo de la novela?","o":["Que ha perdido la voz y ya no puede hablar con nadie","Que se ha convertido en un monstruoso insecto en su cama","Que se ha quedado ciego durante la noche sin darse cuenta","Que ha crecido de golpe hasta convertirse en un gigante"],"a":1,"w":"La primera frase de la novela cuenta que Gregor se despierta transformado en un insecto monstruoso."},{"id":"m024","cat":"Parte I","q":"¿A qué se dedicaba Gregor antes de su transformación?","o":["Era empleado de banco, con uniforme y horario fijo","Era viajante de comercio y vendía telas con muestrario","Era ordenanza en una oficina de seguros de Praga","Era profesor de violín en una academia de música"],"a":1,"w":"Gregor era viajante de comercio: en su cuarto hay un muestrario de telas sobre la mesa."},{"id":"m025","cat":"Parte I","q":"¿Por qué no deja Gregor su trabajo, aunque lo odia?","o":["Porque le han prometido un ascenso inmediato si sigue un año más","Porque su contrato le prohíbe dimitir antes de cumplir diez años","Porque su hermana le ha suplicado que no deje nunca el trabajo","Porque quiere pagar una deuda que sus padres tienen con el jefe"],"a":3,"w":"Gregor piensa que, si no fuera por la deuda de sus padres con el jefe, ya habría dimitido."},{"id":"m026","cat":"Parte I","q":"¿A qué hora estaba puesto el despertador de Gregor?","o":["A las tres","A las cinco","A las cuatro","A las seis"],"a":2,"w":"Gregor comprueba que el despertador estaba bien puesto para las cuatro y se pregunta cómo no lo oyó."},{"id":"m027","cat":"Parte I","q":"¿Quién llama primero a la puerta de Gregor por la mañana?","o":["Su madre","Su hermana","Su padre","La criada"],"a":0,"w":"Es la madre quien le llama suavemente al ver que ya es casi la hora y él no se ha levantado."},{"id":"m028","cat":"Parte I","q":"¿Qué nota Gregor al contestar a su madre?","o":["Que su voz ha cambiado y se mezcla con un chillido doloroso","Que su voz suena más grave y más fuerte que nunca","Que ha olvidado el idioma y solo puede lanzar gritos","Que habla con normalidad, pero nadie le contesta desde fuera"],"a":0,"w":"Gregor se asusta al oír su propia voz, mezclada con un chillido que hace confusas sus palabras."},{"id":"m029","cat":"Parte I","q":"¿Qué explicación se da Gregor a sí mismo sobre el cambio de su voz?","o":["Que es el inicio de un fuerte resfriado de viajante","Que se debe a no haber desayunado todavía","Que se ha quedado ronco de gritar al jefe","Que ha cogido una infección en su último viaje"],"a":0,"w":"Gregor cree que el cambio de voz es el primer síntoma de un resfriado, enfermedad típica de su profesión."},{"id":"m030","cat":"Parte I","q":"¿Por qué tiene Gregor la costumbre de cerrar con llave todas las puertas por la noche?","o":["Teme que su padre le robe el dinero que guarda en el cuarto","Es un hábito que adquirió en sus viajes, incluso estando en casa","Su hermana duerme en el mismo cuarto y quiere intimidad","En el barrio hay muchos robos y vive con mucho miedo"],"a":1,"w":"Gregor mantiene en casa la costumbre de cerrar las puertas con llave que adquirió viajando."},{"id":"m031","cat":"Parte I","q":"¿Quién se presenta en casa de los Samsa para saber por qué Gregor no ha ido a trabajar?","o":["El dueño de la empresa en persona","Un médico del seguro","Un compañero de viaje de Gregor","El apoderado de la empresa"],"a":3,"w":"El apoderado (o gerente) acude personalmente a la casa de Gregor al ver que no ha tomado el tren."},{"id":"m032","cat":"Parte I","q":"¿Por qué le molesta a Gregor que venga el propio apoderado?","o":["Porque el apoderado es su mejor amigo y le debe un favor","Porque el apoderado le debe dinero desde hace años","Porque indica que en la empresa sospechan de él","Porque cree que el apoderado viene a ascenderlo por sus ventas"],"a":2,"w":"Gregor piensa que es injusto que la empresa desconfíe de él por una sola falta, tras años de trabajo."},{"id":"m033","cat":"Parte I","q":"¿Cómo consigue Gregor abrir la puerta de su cuarto?","o":["Empujando con todo su peso hasta forzar la cerradura","Pidiendo a su hermana que abra desde fuera","Rompiendo la puerta con las patas","Haciendo girar la llave con la boca"],"a":3,"w":"Sin manos, Gregor gira la llave con las mandíbulas, aunque de la boca le sale un líquido pardo."},{"id":"m034","cat":"Parte I","q":"¿Cómo reacciona el apoderado al ver a Gregor?","o":["Le ofrece su ayuda y manda llamar enseguida a un médico","Se queda tranquilo y le pide que se vista para ir a trabajar","Retrocede horrorizado y huye escaleras abajo","Se echa a reír y piensa contárselo al jefe en la oficina"],"a":2,"w":"El apoderado suelta un «¡Oh!», retrocede poco a poco y, ya en el rellano, huye escaleras abajo."},{"id":"m035","cat":"Parte I","q":"¿Qué hace la madre al ver a Gregor transformado delante del apoderado?","o":["Se abraza a su hijo llorando de alegría al verlo por fin","Se derrumba en el suelo, vencida por la impresión","Lo echa del piso con una escoba y cierra la puerta","Se enfrenta al apoderado y le exige que se marche"],"a":1,"w":"La madre, con el pelo todavía revuelto, se deja caer en el suelo al ver a su hijo."},{"id":"m036","cat":"Parte I","q":"¿Qué hace el padre para obligar a Gregor a volver a su cuarto?","o":["Lo convence con palabras suaves de que vuelva a su habitación","Lo atrae con un plato de comida y luego cierra la puerta","Ordena a la criada que lo empuje con una escoba hasta su cuarto","Lo acosa con un bastón y un periódico, pateando el suelo"],"a":3,"w":"El padre coge el bastón del apoderado y un periódico y empuja a Gregor, que no entiende sus gritos."},{"id":"m037","cat":"Parte I","q":"¿Cómo termina la primera parte de la novela?","o":["El padre lanza a Gregor, sangrando, a su cuarto y cierra la puerta","Gregor recupera la forma humana y se viste para ir al trabajo","El médico llega y diagnostica una enfermedad rara","Gregor sale de casa y alcanza al apoderado en la calle"],"a":0,"w":"Gregor queda atascado en la puerta, el padre le da un empujón que lo lanza dentro y cierra con el bastón."},{"id":"m038","cat":"Parte I","q":"¿Qué intenta Gregor al hablar con el apoderado cuando ya ha abierto la puerta?","o":["Que le consiga un trabajo mejor en otra ciudad lejana","Que le deje seguir enfermo varios meses sin descontarle el sueldo","Que le perdone una deuda que su familia tiene con la empresa","Que no hable mal de él en la oficina, para no perder su puesto"],"a":3,"w":"Gregor pide al apoderado que interceda por él ante el jefe, pues le preocupa su futuro y el de su familia."},{"id":"m039","cat":"Parte I","q":"¿Qué comenta el apoderado al oír hablar a Gregor detrás de la puerta?","o":["Que es la voz de un hombre muy enfermo","Que Gregor se está burlando de él","Que aquello ha sido una voz de animal","Que reconoce perfectamente la voz de Gregor"],"a":2,"w":"Mientras la madre grita, el apoderado dice con calma que lo que ha oído es una voz de animal."},{"id":"m040","cat":"Parte I","q":"¿Cuál de estas quejas sobre su trabajo NO hace Gregor al despertarse?","o":["Que viaja continuamente y se preocupa por los enlaces de trenes","Que su jefe lo obliga a dormir en la oficina cada noche","Que la comida es mala e irregular","Que trata con gente distinta y nunca hace amistades"],"a":1,"w":"Gregor se queja de los viajes, de la mala comida y de no poder hacer amigos, pero no de dormir en la oficina."},{"id":"m041","cat":"Parte I","q":"¿Cómo describe Gregor el modo en que su jefe trata a sus empleados?","o":["Se sienta en alto, tras su mesa, y les habla desde arriba","Les invita a comer cada día en su casa para charlar","Los reúne en círculo y se sienta en el suelo con ellos","Les escribe notas desde su despacho sin hablar con nadie"],"a":0,"w":"Gregor recuerda que el jefe habla a sus subordinados desde lo alto de su escritorio, aunque oye mal."},{"id":"m042","cat":"Parte I","q":"¿Por qué le parece a Gregor poco creíble avisar de que está enfermo?","o":["Porque ya había faltado muchas veces al trabajo ese mismo año","Porque en cinco años de servicio no había estado enfermo ni una vez","Porque el médico del seguro era amigo suyo y lo conocía","Porque el jefe había prohibido enfermar durante la primavera"],"a":1,"w":"Gregor piensa que sería sospechoso, pues nunca había estado enfermo en sus cinco años en la empresa."},{"id":"m043","cat":"Parte I","q":"¿Cómo logra Gregor salir de la cama?","o":["Con la ayuda de su padre y de la criada, que lo levantan","Saltando con las patas por la ventana abierta","Balanceándose hasta caer sobre la alfombra","Arrastrándose hacia atrás por debajo de la cama"],"a":2,"w":"Gregor se balancea y se deja caer; la alfombra amortigua el golpe."},{"id":"m044","cat":"Parte I","q":"¿Qué dice la madre al apoderado sobre las costumbres de Gregor?","o":["Que sale casi todas las noches con sus amigos a divertirse","Que se pasa el día durmiendo y por la noche trabaja","Que gasta demasiado dinero en caprichos y en el juego","Que solo piensa en el trabajo y no sale por las tardes"],"a":3,"w":"La madre defiende a su hijo: solo piensa en el negocio y las tardes las pasa en casa leyendo el periódico."},{"id":"m045","cat":"Parte I","q":"¿Qué afición tenía Gregor, según su madre?","o":["Hacer pequeños trabajos de carpintería con una sierra","Tocar el violín con su hermana por las noches","Coleccionar sellos de todos los países que visita","Dibujar paisajes de las ciudades por las que viaja"],"a":0,"w":"La madre cuenta que Gregor se entretiene con la sierra y que ha hecho un marco que cuelga en su cuarto."},{"id":"m046","cat":"Parte I","q":"¿A quiénes mandan llamar los padres y la hermana cuando creen que Gregor está enfermo?","o":["Al médico y a la policía","Al cura y al médico","Al jefe y al cerrajero","Al médico y al cerrajero"],"a":3,"w":"La madre manda a Grete por el médico y el padre ordena a la criada que traiga un cerrajero."},{"id":"m047","cat":"Parte I","q":"¿Qué reprocha el apoderado a Gregor, además de su ausencia?","o":["Que ha perdido varios muestrarios importantes de la empresa","Que ha insultado a unos clientes en su último viaje","Que ha pedido demasiadas vacaciones durante el último año","Que sus ventas han sido muy poco satisfactorias últimamente"],"a":3,"w":"El apoderado le advierte de que su rendimiento ha sido muy insatisfactorio y que su puesto no es seguro."},{"id":"m048","cat":"Parte I","q":"¿Qué tiempo hace la mañana en que Gregor despierta convertido en insecto?","o":["Hace un sol radiante","Nieva con fuerza","Hay una tormenta de viento y truenos","Está nublado y llueve"],"a":3,"w":"Gregor oye las gotas de lluvia en el cristal y ve el cielo cubierto, un tiempo gris que lo pone todavía más triste."},{"id":"m049","cat":"Parte I","q":"¿Qué siente Gregor al oír que van a llamar al médico y al cerrajero?","o":["Se siente otra vez entre personas y espera mucho de su ayuda","Se enfurece porque nadie respeta ya su intimidad","Teme que descubran su secreto y quiere huir de casa","Se queda indiferente porque ya no espera nada de nadie"],"a":0,"w":"Gregor cree que la familia reacciona con acierto y se siente otra vez parte del mundo de las personas."},{"id":"m050","cat":"Parte I","q":"¿Qué ve Gregor al mirarse en la cama?","o":["Un vientre pardo y abombado y muchas patas delgadas","Unas alas transparentes y una cola larga y puntiaguda","Un cuerpo peludo con cuatro patas gruesas y fuertes","Un caparazón de piedra y dos grandes pinzas"],"a":0,"w":"Gregor se ve con la espalda dura, un vientre pardo dividido en tramos y muchas patitas que se agitan."},{"id":"m051","cat":"Parte I","q":"¿Cómo reacciona el padre la primera vez que ve a Gregor transformado?","o":["Aprieta los puños, hostil, y luego se echa a llorar","Se echa a reír a carcajadas, creyendo que es una broma","Lo abraza llamándolo «hijo mío» con lágrimas de alegría","Se desmaya sobre la mesa del desayuno"],"a":0,"w":"El padre mira con hostilidad, cierra los puños como para golpear a Gregor y después se tapa los ojos y llora."},{"id":"m052","cat":"Parte I","q":"¿Qué es lo primero que preocupa a Gregor tras despertar convertido en insecto?","o":["Saber si podrá volver a ser humano algún día","Perder el tren y las consecuencias en el trabajo","Avisar a un médico cuanto antes para que lo cure","Que su familia se burle de él al verlo así"],"a":1,"w":"Gregor piensa sobre todo en llegar tarde al tren y en la reacción del jefe, más que en su propio cambio."},{"id":"m053","cat":"Parte II","q":"Al despertar al anochecer, ¿qué encuentra Gregor junto a la puerta?","o":["Un plato de carne con patatas todavía caliente","Leche azucarada con trocitos de pan blanco","Un cuenco de agua fresca y un hueso con carne","Una bandeja con fruta fresca recién cortada"],"a":1,"w":"Su hermana le había dejado su bebida favorita de antes: leche azucarada con pan blanco."},{"id":"m054","cat":"Parte II","q":"¿Qué ocurre cuando Gregor prueba la leche, que antes era su bebida favorita?","o":["Se la bebe entera con gusto","Le sabe mal y se aparta sin terminarla","La derrama sin querer","Su hermana se la quita antes de que la pruebe"],"a":1,"w":"Gregor se aparta decepcionado: la leche ya no le gusta y se arrastra al centro de la habitación."},{"id":"m055","cat":"Parte II","q":"¿Dónde se oculta Gregor cuando entra su hermana?","o":["Detrás de la cómoda","Debajo del sofá","Dentro del armario","Debajo de la cama"],"a":1,"w":"Gregor se esconde bajo el sofá (el canapé) para evitar que su hermana lo vea."},{"id":"m056","cat":"Parte II","q":"¿Qué comida prefiere Gregor tras su transformación?","o":["Verduras frescas y fruta recién cortada","Pan recién hecho acompañado de leche caliente","Alimentos en mal estado, como verduras casi podridas y queso","Carne asada con patatas, como el resto de la familia"],"a":2,"w":"Grete le trae comida variada sobre un periódico viejo; Gregor elige lo estropeado y rechaza lo fresco."},{"id":"m057","cat":"Parte II","q":"¿Por qué sale Grete del cuarto mientras Gregor come y cierra con llave?","o":["Tiene miedo de que Gregor la ataque si se queda en el cuarto","Su madre la llama a gritos desde el salón para que vuelva","Va a buscar al médico, que acaba de llegar a la puerta","Sabe que Gregor no comería delante de ella y quiere darle intimidad"],"a":3,"w":"Grete sale, por consideración, para que Gregor pueda comer sin que ella lo vea."},{"id":"m058","cat":"Parte II","q":"¿Qué hace la criada de la casa el primer día tras la transformación?","o":["Se enfrenta a Gregor con una escoba para echarlo de casa","Se arrodilla, pide que la dejen marchar y jura no contar nada","Pide un aumento de sueldo para quedarse a servir a la familia","Se queda a cuidar de Gregor con gran cariño y paciencia"],"a":1,"w":"La criada pide que la dejen irse y, agradecida, promete callar lo ocurrido aunque nadie se lo pidió."},{"id":"m059","cat":"Parte II","q":"¿Qué explica el padre sobre el dinero de la familia?","o":["Que la familia es rica y puede vivir de las rentas siempre","Que queda algo de dinero ahorrado, pero solo para uno o dos años","Que no queda nada y deben vender el piso de inmediato","Que el jefe de Gregor les pagará una pensión mensual"],"a":1,"w":"El padre cuenta que hay ahorros del antiguo negocio y del dinero de Gregor, pero que no bastan para vivir de ellos mucho tiempo."},{"id":"m060","cat":"Parte II","q":"¿Qué proyecto secreto tenía Gregor para su hermana?","o":["Enviarla al conservatorio para que estudiara música","Pagarle un viaje de estudios a Viena durante un año","Casarla con un joven rico de buena familia","Comprarle una tienda de música para que trabajara"],"a":0,"w":"Gregor sabía que Grete tocaba muy bien el violín y quería pagarle los estudios en el conservatorio."},{"id":"m061","cat":"Parte II","q":"¿Cuándo pensaba Gregor dar a conocer su plan para la hermana?","o":["En el cumpleaños de su hermana","Al conseguir un ascenso","En Año Nuevo","En Navidad"],"a":3,"w":"Gregor quería anunciar su plan en Navidad, pero la transformación se lo impidió."},{"id":"m062","cat":"Parte II","q":"¿Por qué nadie, ni siquiera Grete, creía al principio que Gregor podía entender lo que decían?","o":["Porque Gregor había perdido el oído desde la transformación","Porque Gregor dormía casi todo el día en su rincón","Porque no le entendían y creían que él tampoco a ellos","Porque Gregor había perdido por completo la inteligencia"],"a":2,"w":"Como nadie le entendía, hablaban delante de él sin pensar que Gregor se enteraba de todo."},{"id":"m063","cat":"Parte II","q":"¿Qué hace Gregor para que su hermana no tenga que verlo?","o":["Se esconde dentro del armario cada vez que ella entra","Cubre el sofá con una sábana que carga sobre su espalda","Duerme debajo de la cama, tapado con una manta","Tapa la ventana con una cortina para tener oscuridad"],"a":1,"w":"Gregor tarda horas en cubrir con la sábana el sofá para que Grete no vea ni la parte de su cuerpo que sobresale."},{"id":"m064","cat":"Parte II","q":"¿Qué costumbre nueva adquiere Gregor para entretenerse?","o":["Escribir cartas largas a sus antiguos compañeros","Cantar canciones por las noches con voz suave","Tocar el violín de su hermana a escondidas","Trepar por las paredes y el techo"],"a":3,"w":"Gregor se divierte colgado del techo y deja huellas de la sustancia pegajosa de sus patas."},{"id":"m065","cat":"Parte II","q":"¿Qué decide hacer Grete con los muebles del cuarto de Gregor?","o":["Venderlos para conseguir algo de dinero para la casa","Cambiarlos de sitio para que la habitación parezca más alegre","Sacarlos para que Gregor tenga más sitio para moverse","Quemarlos por motivos de higiene y limpieza"],"a":2,"w":"Grete cree que Gregor necesita espacio para trepar y quiere vaciar la habitación, y pide ayuda a su madre."},{"id":"m066","cat":"Parte II","q":"¿Por qué se opone la madre a vaciar el cuarto?","o":["Piensa que los muebles son muy caros y no deben moverse","Teme que el padre se enfade con Grete al verlo","Cree que sería darlo por perdido; quiere todo igual","Prefiere que Gregor duerma en la cocina con ella"],"a":2,"w":"La madre dice que quitar los muebles parecería renunciar a toda esperanza de mejoría."},{"id":"m067","cat":"Parte II","q":"¿Qué comprende Gregor al oír a su madre?","o":["Que vaciar el cuarto le haría olvidar su pasado como persona","Que su madre ya no lo quiere y prefiere olvidarlo","Que el cuarto está demasiado sucio y necesita limpieza","Que su hermana quiere echarlo de casa cuanto antes"],"a":0,"w":"Gregor se da cuenta de que los muebles le recuerdan su vida humana y de que estaba a punto de olvidarla."},{"id":"m068","cat":"Parte II","q":"¿A qué se aferra Gregor cuando ve que vacían su cuarto?","o":["Al escritorio, agarrándose con fuerza a sus patas","A la ventana, con la intención de salir a la calle","Al techo, junto a la lámpara, para no ser visto","Al cuadro de la dama con pieles, pegándose a su cristal"],"a":3,"w":"Gregor se pega al cristal del cuadro de la dama con pieles para que nadie se lo lleve."},{"id":"m069","cat":"Parte II","q":"¿Qué le ocurre a la madre al ver a Gregor sobre la pared?","o":["Sale corriendo a la calle pidiendo ayuda a los vecinos","Se enfurece, coge una escoba y lo golpea","Grita «¡Dios mío!» y cae desmayada sobre el sofá","Se acerca despacio para acariciarlo con ternura"],"a":2,"w":"La madre ve una enorme mancha parda sobre el papel de la pared, se da cuenta de que es Gregor y se desmaya."},{"id":"m070","cat":"Parte II","q":"¿Qué hace Grete por primera vez desde la transformación al ver a Gregor sobre la pared?","o":["Le pide perdón por no haberlo cuidado mejor antes","Le ofrece comida para que baje de la pared sin miedo","Le grita su nombre, con el puño en alto, por primera vez","Le canta una nana para tranquilizarlo y calmarlo"],"a":2,"w":"Era la primera vez que Grete se dirigía a él directamente desde su transformación."},{"id":"m071","cat":"Parte II","q":"¿Cómo se hiere Gregor al ir tras su hermana a la habitación contigua?","o":["Se cae por la escalera al intentar seguir a su hermana","Se pilla una pata con la puerta al cerrarla Grete","Una esquirla de un frasco roto y una medicina corrosiva","Se corta con unas tijeras que había en el suelo"],"a":2,"w":"Gregor sobresalta a Grete, que deja caer un frasco; los cristales y la medicina le alcanzan."},{"id":"m072","cat":"Parte II","q":"¿Cómo va vestido el padre cuando llega a casa tras el desmayo de la madre?","o":["Con un traje negro de levita, como el de un notario","Con un uniforme azul de botones dorados, de banco","Con ropa de campo y botas de trabajo","En camisón y bata, recién levantado de la siesta"],"a":1,"w":"El padre, que ahora trabaja en un banco, aparece erguido y con uniforme, muy distinto del hombre cansado de antes."},{"id":"m073","cat":"Parte II","q":"¿Qué arroja el padre a Gregor?","o":["Manzanas","Libros","Zapatos","Cuchillos"],"a":0,"w":"El padre llena sus bolsillos con la fruta del frutero del aparador y le bombardea con manzanas."},{"id":"m074","cat":"Parte II","q":"¿Qué consecuencia tiene una de las manzanas?","o":["Se le clava en la espalda y lo hiere gravemente","Rebota sin causarle ningún daño y rueda por el suelo","Atraviesa la ventana y cae a la calle","Gregor la devora con ganas, porque tiene hambre"],"a":0,"w":"Una manzana se queda incrustada en su espalda y Gregor queda muy malherido."},{"id":"m075","cat":"Parte II","q":"¿Qué hace la madre al final de la segunda parte?","o":["Se une al padre lanzando también manzanas a Gregor","Corre hacia el padre y le ruega por la vida de Gregor","Huye y se encierra en la cocina con la criada","Llama a la policía desde la ventana del salón"],"a":1,"w":"La madre se abraza al padre y le pide que no mate a Gregor; así termina la segunda parte."},{"id":"m076","cat":"Parte II","q":"¿Cómo reacciona Gregor al saber que su madre o Grete tendrán que ponerse a trabajar?","o":["Se alegra, pensando que así lo dejarán en paz","Se queda indiferente, sin prestar atención","Siente vergüenza y pena, y se echa sobre el sofá de cuero","Se enfada con su padre por no haber trabajado antes"],"a":2,"w":"Gregor se avergüenza de que la familia deba trabajar por su culpa y se lanza sobre el sofá de cuero."},{"id":"m077","cat":"Parte II","q":"¿Qué papel tenía Gregor en la economía familiar antes de su transformación?","o":["Era quien mantenía a todos con su sueldo de viajante","Ayudaba solo con pequeñas cantidades de dinero","Estudiaba y no trabajaba todavía","Cuidaba de la casa mientras los padres trabajaban"],"a":0,"w":"Gregor mantenía a sus padres y a su hermana, y la familia se había acostumbrado a su dinero."},{"id":"m078","cat":"Parte II","q":"¿Qué le ocurrió al negocio del padre cinco años antes?","o":["Se vendió por una gran suma y vivieron de ello","Quebró, y Gregor se esforzó más en su trabajo","Lo heredó Gregor y lo cerró por falta de tiempo","Lo destruyó un incendio y no tenían seguro"],"a":1,"w":"Tras la quiebra, Gregor pasó de empleado a viajante y empezó a ganar dinero para la familia."},{"id":"m079","cat":"Parte II","q":"¿Qué ve Gregor ahora al mirar por la ventana?","o":["Un jardín florido y luminoso, visto con total nitidez","A su hermana paseando por la calle con su violín","El tren en el que solía viajar todas las mañanas","Todo borroso, ni siquiera distingue el hospital de enfrente"],"a":3,"w":"Su vista empeora cada día: ya no distingue ni el hospital que antes tanto detestaba ver."},{"id":"m080","cat":"Parte II","q":"¿Cómo se comporta Grete al entrar en la habitación de Gregor?","o":["Se sienta a su lado y le lee el periódico en voz alta","Le acaricia con ternura antes de entrar a limpiar","Abre enseguida la ventana, como si se ahogara","Deja la ventana siempre bien cerrada por el frío"],"a":2,"w":"Grete cierra la puerta y abre la ventana de golpe como si se ahogara en la habitación con Gregor."},{"id":"m081","cat":"Parte II","q":"¿Qué hacen los padres durante los primeros días tras la transformación?","o":["Entran cada tarde a leerle el periódico en voz alta","Lo visitan a diario y le llevan flores del mercado","Se van de viaje unos meses para no tener que verlo","No se atreven a entrar y esperan fuera mientras Grete limpia"],"a":3,"w":"Los padres esperan junto a la puerta y Grete les cuenta cómo está Gregor."},{"id":"m082","cat":"Parte II","q":"¿Qué dice el padre cuando Grete le explica que Gregor ha salido de su cuarto?","o":["Que Gregor debía quedarse con ellos en el salón","Que se alegraba mucho de verlo fuera de su cuarto","Que había que llamar enseguida de nuevo al médico","Que ya lo había dicho él y no le hacían caso"],"a":3,"w":"El padre reacciona con enfado y cree lo peor de Gregor sin escuchar explicaciones."},{"id":"m083","cat":"Parte III","q":"¿Qué ocurre con la manzana clavada en el cuerpo de Gregor?","o":["Su hermana la extrae con unas pinzas y la cura","Nadie se atreve a sacarla y queda a la vista","Se cae sola al poco tiempo y la herida cicatriza","El médico la extirpa en una pequeña operación"],"a":1,"w":"La manzana permanece incrustada y con el tiempo se pudre, haciendo más graves sus problemas."},{"id":"m084","cat":"Parte III","q":"¿Qué ventaja tiene Gregor, a cambio de haber perdido movilidad?","o":["Su hermana toca el violín cada noche para él","Puede salir al balcón a tomar el aire","Le llevan comidas muy elaboradas todos los días","Dejan abierta por las tardes la puerta del salón"],"a":3,"w":"La familia deja abierta la puerta del salón, y Gregor mira desde la oscuridad."},{"id":"m085","cat":"Parte III","q":"¿Qué manía tiene el padre con su uniforme?","o":["Se niega a quitárselo, incluso para dormir en casa","Lo vende para pagar parte de las deudas","Lo guarda con cuidado en el armario del pasillo","Solo se lo pone los domingos y días de fiesta"],"a":0,"w":"El padre duerme vestido con el uniforme, que se va estropeando, como si siempre esperase órdenes."},{"id":"m086","cat":"Parte III","q":"¿A qué se dedica ahora el padre?","o":["Continúa con su negocio, que ha vuelto a levantar","Es camarero en un gran hotel de la ciudad","Tiene un empleo en un banco, como ordenanza","Trabaja de sastre en una tienda del barrio"],"a":2,"w":"El padre, tras cinco años sin trabajar, tiene un empleo de ordenanza en un banco."},{"id":"m087","cat":"Parte III","q":"¿Qué trabajo hace la madre para ganar dinero?","o":["Da clases de música a los niños del barrio","Friega platos en un restaurante por las noches","Cose ropa interior para una tienda de modas","Vende periódicos en la puerta de la estación"],"a":2,"w":"La madre cose ropa interior fina para una tienda, además de ocuparse de la casa."},{"id":"m088","cat":"Parte III","q":"¿Qué hace Grete para mejorar su situación laboral?","o":["Da clases de violín a niñas del barrio por las tardes","Trabaja en una oficina de seguros y estudia contabilidad","Es dependienta y estudia taquigrafía y francés por las noches","Estudia medicina por las noches en la universidad"],"a":2,"w":"Grete trabaja en una tienda y por las noches aprende taquigrafía y francés para conseguir un puesto mejor."},{"id":"m089","cat":"Parte III","q":"¿Qué han hecho los Samsa con algunas joyas de la familia?","o":["Se las han regalado a Grete","Las han escondido en la habitación de Gregor","Las han vendido","Las han guardado para la boda de Grete"],"a":2,"w":"Gregor se entera de que vendieron varias joyas, aunque a su madre y a su hermana les gustaba llevarlas."},{"id":"m090","cat":"Parte III","q":"¿Qué cambio hay en el servicio doméstico de la casa?","o":["Contratan a otras dos criadas para ayudar a la madre","Grete deja su empleo para dedicarse a las tareas de casa","Los huéspedes se encargan por turnos de la limpieza","Despiden a la criada y viene una asistenta fuerte por horas"],"a":3,"w":"Para ahorrar, despiden a la criada y contratan a una asistenta fuerte para los trabajos más duros."},{"id":"m091","cat":"Parte III","q":"Según Gregor, ¿cuál es la razón principal por la que la familia no se muda a un piso más pequeño?","o":["Su desesperación por la desgracia que les había caído","Que el casero se lo prohíbe por contrato","Que Gregor insiste mucho en quedarse en su cuarto","Que el piso les parece barato y cómodo para todos"],"a":0,"w":"Gregor ve que, más que el problema de trasladarlo, les frena su desánimo, ya que se creían golpeados como nadie."},{"id":"m092","cat":"Parte III","q":"¿Cómo se dirige la asistenta a Gregor al abrir su puerta?","o":["Con apelativos «cariñosos» sobre un escarabajo","Con respeto, llamándole siempre «señor Samsa»","Con silencio absoluto, sin atreverse a mirarlo","Con gritos e insultos para que se esconda"],"a":0,"w":"La asistenta no siente asco por Gregor y le habla con expresiones como «viejo escarabajo»."},{"id":"m093","cat":"Parte III","q":"¿Cómo reacciona la asistenta cuando Gregor avanza hacia ella?","o":["Huye gritando escaleras abajo en busca de ayuda","Cae desmayada al suelo del susto","Llama a gritos a los huéspedes y a la familia","Coge una silla, dispuesta a golpearle, sin asustarse"],"a":3,"w":"La asistenta levanta una silla y espera tranquilamente, con la boca abierta, a que Gregor se acerque."},{"id":"m094","cat":"Parte III","q":"¿Cómo ha cambiado la forma de alimentarse de Gregor?","o":["Casi ha dejado de comer","Come el doble","Solo come lo que le dan los huéspedes","Solo come por la noche"],"a":0,"w":"Gregor apenas prueba la comida que le dejan y a menudo la escupe; está cada vez más débil."},{"id":"m095","cat":"Parte III","q":"¿Qué cambio en el piso obliga a la familia a amontonar trastos en el cuarto de Gregor?","o":["Alquilan una de las habitaciones a tres huéspedes","Se mudan a otro barrio más barato","Reciben a unos tíos de visita durante meses","Reforman por completo el salón"],"a":0,"w":"Los huéspedes traen sus propios muebles y lo que sobra de la casa acaba en el cuarto de Gregor."},{"id":"m096","cat":"Parte III","q":"¿Cómo son los tres huéspedes?","o":["Jóvenes, alegres y bastante desordenados","Serios, barbudos y muy exigentes con el orden","Ancianos, sordos y muy amables con todos","Soldados de permiso, ruidosos y bromistas"],"a":1,"w":"Los huéspedes son tres caballeros barbudos y muy ordenados, que exigen limpieza en todo el piso."},{"id":"m097","cat":"Parte III","q":"¿Qué ocurre cuando la madre limpia a fondo el cuarto de Gregor?","o":["Gregor se alegra mucho y su hermana lo agradece","Nadie se da cuenta de que el cuarto está más limpio","Grete se enfada mucho y toda la familia discute","El padre felicita a la madre por su iniciativa"],"a":2,"w":"Grete considera que limpiar el cuarto es cosa suya; el padre culpa a la madre y la hermana grita."},{"id":"m098","cat":"Parte III","q":"¿Quién toca el violín en la escena de los huéspedes?","o":["La madre, para animar al padre en la cocina","Grete, que toca ante los huéspedes en el salón","El padre, para pedir silencio a los huéspedes","Uno de los huéspedes, para acompañar a Grete"],"a":1,"w":"Los huéspedes piden que Grete toque en el salón, pero pronto pierden el interés."},{"id":"m099","cat":"Parte III","q":"¿Qué siente Gregor al oír tocar el violín a Grete?","o":["Hambre y deseo de atacar a los huéspedes","La música le atrae y se pregunta si es un animal","Ganas de salir a la calle de inmediato","Rabia, porque no soporta ningún ruido"],"a":1,"w":"Gregor se acerca a escuchar y se pregunta si es un animal, ya que la música le emociona."},{"id":"m100","cat":"Parte III","q":"¿Cómo reaccionan los huéspedes al ver a Gregor?","o":["Se ríen y le piden que se quede con ellos en el salón","Llaman a la policía para denunciar a la familia","Ofrecen pagar más por la habitación con tal de quedarse","Dejan el cuarto sin pagar y hablan de reclamar daños"],"a":3,"w":"El huésped del medio dice que se marchan por las repugnantes condiciones de la casa y los otros dos le siguen."},{"id":"m101","cat":"Parte III","q":"¿Qué propone Grete a sus padres tras la escena de los huéspedes?","o":["Que deben librarse de aquello, porque ya no puede ser Gregor","Que lo lleven a un hospital lejano para que lo cuiden","Que lo cuiden más tiempo en el comedor, con ellos","Que se muden de ciudad llevándose a Gregor con ellos"],"a":0,"w":"Grete dice que no quiere llamarle hermano y que tienen que deshacerse de él, que ya no es Gregor."},{"id":"m102","cat":"Parte III","q":"¿Qué ocurre cuando Gregor vuelve a su cuarto tras el discurso de Grete?","o":["Grete cierra con llave y dice «¡Por fin!»","Su padre le abre la ventana para que respire","Su madre le trae una comida especial","Su hermana le pide perdón y se queda un rato"],"a":0,"w":"Grete, impaciente, estaba esperando junto a la puerta y la cierra con llave nada más entrar él."},{"id":"m103","cat":"Parte III","q":"¿Cómo muere Gregor?","o":["En su cuarto, de madrugada, pensando en su familia","Atropellado por un tranvía al salir a la calle","Aplastado por el padre con un golpe de bastón","Tras una pelea violenta con los huéspedes"],"a":0,"w":"Tras oír dar las tres, Gregor piensa en su familia con ternura y su cabeza se hunde con el amanecer."},{"id":"m104","cat":"Parte III","q":"¿Quién descubre que Gregor ha muerto?","o":["Su hermana Grete, al llevarle la comida de la mañana","La asistenta, al empujarlo con la escoba","Su madre, al abrir la puerta para limpiar","El médico, que llega a visitarlo esa mañana"],"a":1,"w":"La asistenta, que cree que Gregor se hace el muerto, lo empuja con la escoba y avisa a gritos."},{"id":"m105","cat":"Parte III","q":"¿Qué hace el señor Samsa al saber que Gregor ha muerto?","o":["Se desmaya y lo atienden las mujeres de la casa","Pide perdón a Grete por su comportamiento","Dice que hay que dar gracias a Dios y se santigua","Se enfada con la asistenta por haberlo avisado"],"a":2,"w":"El padre se persigna y las tres mujeres le imitan."},{"id":"m106","cat":"Parte III","q":"¿Qué observa Grete al contemplar el cuerpo de Gregor?","o":["Lo delgado que estaba, pues apenas comía","Que parecía dormido y tranquilo, como un niño","Que olía muy mal y había que sacarlo enseguida","Que tenía en la cara una sonrisa muy extraña"],"a":0,"w":"Grete comenta que Gregor estaba muy flaco porque la comida salía igual que entraba."},{"id":"m107","cat":"Parte III","q":"¿Qué hace el señor Samsa con los huéspedes tras la muerte de Gregor?","o":["Les pide que se queden otra semana, con las disculpas","Los invita a desayunar con la familia en el salón","Les ordena que abandonen su casa, y ellos se van","Los lleva a la comisaría para denunciarlos"],"a":2,"w":"El señor Samsa, con su mujer e hija del brazo, echa a los huéspedes, que se marchan sin protestar."},{"id":"m108","cat":"Parte III","q":"¿Qué escriben los tres Samsa tras la muerte de Gregor?","o":["Cartas de pésame para sus parientes de Praga","Cartas de queja contra los huéspedes que se marchan","Cartas para ofrecer el piso en venta","Cartas para excusarse de ir a trabajar ese día"],"a":3,"w":"Los tres escriben a sus jefes para justificar que se toman el día libre."},{"id":"m109","cat":"Parte III","q":"¿Cómo pasa la familia ese día?","o":["Se quedan en casa llorando toda la jornada","Salen juntos al campo en tranvía, tras meses sin salir","Viajan en tren a otra ciudad para buscar piso","Van juntos al teatro para distraerse esa noche"],"a":1,"w":"Los tres salen juntos al campo en tranvía, con sol, hablando de sus planes de futuro."},{"id":"m110","cat":"Parte III","q":"¿Qué comentan los padres al ver cómo se ha puesto su hija?","o":["Que debe estudiar en el conservatorio de Praga","Que debe dedicarse solo al violín en adelante","Que debe cuidar de su padre durante su vejez","Que pronto será hora de buscarle un buen marido"],"a":3,"w":"Los padres ven que Grete se ha convertido en una joven hermosa y piensan en casarla."},{"id":"m111","cat":"Parte III","q":"Tras oír a la asistenta, ¿qué decide el señor Samsa?","o":["Subirle el sueldo ese mismo mes","Invitarla a comer con la familia","Darle un día libre de trabajo","Despedirla esa misma noche"],"a":3,"w":"Molesto por su actitud y por su portazo, el señor Samsa dice que esa noche la despide."},{"id":"m112","cat":"Parte III","q":"¿En qué momento del año termina la novela?","o":["A finales de marzo, con la llegada de la primavera","En pleno verano, con el calor del mediodía","En Navidad, con la nieve en las calles","En otoño, cuando caen las hojas de los árboles"],"a":0,"w":"La asistenta abre la ventana y el aire ya es cálido porque estaban a finales de marzo."},{"id":"m113","cat":"Personajes","q":"¿Qué preocupa más a Gregor al principio de la novela, aun estando transformado?","o":["Vengarse de su jefe por todos los años de trabajo","Mantener a su familia y no perder su empleo","Abandonar a sus padres para empezar una nueva vida","Buscar a un médico famoso que pueda curarlo"],"a":1,"w":"Los primeros pensamientos de Gregor giran en torno al trabajo, el tren y el dinero de su familia."},{"id":"m114","cat":"Personajes","q":"¿Qué conserva Gregor de su condición humana a pesar de su cuerpo de insecto?","o":["Habla con normalidad, aunque lo hace muy despacio","Solo conserva la memoria, pero no entiende a los demás","Mantiene su aspecto, aunque no puede moverse","Entiende a los demás, pero no puede hacerse entender"],"a":3,"w":"Gregor comprende lo que dicen los demás, pero su voz ya no se entiende."},{"id":"m115","cat":"Personajes","q":"¿Qué siente Gregor hacia su familia en el momento de morir?","o":["Rencor hacia ellos, y desea vengarse de todos","Indiferencia total hacia lo que suceda en casa","Cariño, y piensa que debe irse para no estorbar","Miedo a la familia, y quiere huir de la casa"],"a":2,"w":"Antes de morir, Gregor piensa en su familia con emoción y amor, y cree que debe irse."},{"id":"m116","cat":"Personajes","q":"¿Cómo cambia el padre entre el principio y la mitad de la novela?","o":["De ser violento pasa a ser amable y cariñoso","De ser rico pasa a vivir pidiendo limosna","De hombre abatido pasa a ser fuerte y violento","No cambia nada en toda la novela"],"a":2,"w":"El padre, antes cansado e inactivo, vuelve a trabajar y se muestra fuerte y agresivo con Gregor."},{"id":"m117","cat":"Personajes","q":"¿Cómo se comporta el padre ante los huéspedes?","o":["Con autoridad, dándoles órdenes sin cesar","Con burlas y desprecio abierto","Con servilismo y una cortesía exagerada","Con total indiferencia, sin mirarlos"],"a":2,"w":"Los padres, que nunca habían alquilado una habitación, tratan a los huéspedes con gran cortesía."},{"id":"m118","cat":"Personajes","q":"¿Qué problema de salud tiene la madre de Gregor?","o":["Asma, que le dificulta mucho respirar","Una ceguera parcial que le impide ver bien","Una cojera que le obliga a usar bastón","Una sordera que le dificulta oír a los demás"],"a":0,"w":"La madre sufre asma y pasa muchos días jadeando en el sofá junto a la ventana abierta."},{"id":"m119","cat":"Personajes","q":"¿Qué sentimientos muestra la madre hacia Gregor?","o":["Pena y cariño, pero se desmaya al verlo","Odio desde el primer día, y no quiere verlo","Indiferencia, como con un animal doméstico","Deseo de echarlo de casa cuanto antes"],"a":0,"w":"La madre quiere ver a su hijo y defiende que se le mantenga su cuarto, pero su aspecto la impresiona."},{"id":"m120","cat":"Personajes","q":"¿Qué edad tiene Grete al principio de la novela?","o":["Doce años","Veintiún años","Veinticinco años","Diecisiete años"],"a":3,"w":"El libro la presenta como una muchacha de diecisiete años, casi todavía una niña."},{"id":"m121","cat":"Personajes","q":"¿Qué instrumento toca Grete?","o":["El piano","La flauta","La guitarra","El violín"],"a":3,"w":"Grete es una violinista expresiva y Gregor soñaba con pagarle el conservatorio."},{"id":"m122","cat":"Personajes","q":"¿Qué miembro de la familia se encarga primero de cuidar y alimentar a Gregor?","o":["Su hermana Grete","Su madre, la señora Samsa","Su padre, el señor Samsa","La criada de la casa"],"a":0,"w":"Grete es quien le lleva la comida y limpia su cuarto, mientras sus padres no se atreven a entrar."},{"id":"m123","cat":"Personajes","q":"¿Cómo evoluciona la actitud de Grete hacia Gregor?","o":["De ignorarlo por completo pasa a quererlo mucho","Siempre le trata con la misma dulzura que al principio","De temerlo pasa a defenderlo ante el padre","De cuidarle con cariño a querer deshacerse de él"],"a":3,"w":"Grete empieza cuidando a su hermano y acaba diciendo que hay que librarse de aquello."},{"id":"m124","cat":"Personajes","q":"¿Qué personaje parece «florecer» al final de la novela?","o":["La madre","Grete","El padre","La asistenta"],"a":1,"w":"Al final, los padres ven que Grete se ha convertido en una joven hermosa."},{"id":"m125","cat":"Personajes","q":"¿Cómo se comporta el apoderado ante Gregor?","o":["Con amistad y comprensión hacia su situación","Con timidez, sin atreverse a decirle nada","Con alegría, y le felicita por su trabajo","Severo y desconfiado; le reprocha sus ventas"],"a":3,"w":"El apoderado le regaña, duda de él y hasta alude a dinero entregado a Gregor."},{"id":"m126","cat":"Personajes","q":"¿Quién es el que parece dirigir a los tres huéspedes?","o":["El más joven","El más bajo","El huésped del medio","El que lleva sombrero"],"a":2,"w":"El del medio parece la autoridad para los otros dos, y habla por todos."},{"id":"m127","cat":"Personajes","q":"¿Cómo se marchan los huéspedes cuando el señor Samsa les ordena salir?","o":["Se marchan sin protestar, con cierta humildad","Se niegan a salir y llaman a la policía","Se pelean con el padre en el rellano","Exigen que les devuelvan el dinero del alquiler"],"a":0,"w":"El huésped del medio se queda quieto un momento y dice «nos vamos»; los otros le siguen."},{"id":"m128","cat":"Personajes","q":"¿Cómo es la asistenta que trabaja para los Samsa?","o":["Una muchacha de dieciséis años, tímida y asustadiza","Una viuda mayor, robusta y fuerte, a la que Gregor no asusta","Una anciana frágil y enferma que casi no puede andar","Una joven elegante que vive en el centro de la ciudad"],"a":1,"w":"La asistenta es una viuda mayor, de huesos fuertes, acostumbrada a lo duro."},{"id":"m129","cat":"Personajes","q":"¿Qué anuncia con una sonrisa la asistenta tras la muerte de Gregor?","o":["Que va a pedir más sueldo a los señores","Que necesita un día libre para visitar a su familia","Que ya se ha ocupado de deshacerse del cuerpo","Que quiere dejar el empleo por miedo a Gregor"],"a":2,"w":"La asistenta dice que no hay que preocuparse de cómo deshacerse de aquello, que ya está arreglado."},{"id":"m130","cat":"Personajes","q":"¿Qué personaje defiende que se conserven los muebles en el cuarto de Gregor?","o":["La madre","El padre","Grete","La asistenta"],"a":0,"w":"La madre cree que vaciar el cuarto sería dar a Gregor por perdido."},{"id":"m131","cat":"Personajes","q":"¿Cuál de estos adjetivos define mejor a Gregor antes de su transformación?","o":["Perezoso y vago","Trabajador y sacrificado","Rebelde y violento","Aventurero y despreocupado"],"a":1,"w":"Gregor trabajaba sin descanso para mantener a su familia y pagar sus deudas."},{"id":"m132","cat":"Personajes","q":"¿Qué imagen tenía Gregor de su padre antes de la transformación?","o":["La de un hombre fuerte con uniforme de banco","La de un hombre cansado, sentado en un sillón y en bata","La de un hombre violento que siempre le gritaba","La de un hombre rico y alegre que le daba consejos"],"a":1,"w":"Gregor recordaba a su padre como un anciano cansado, casi enterrado en la cama o el sillón."},{"id":"m133","cat":"Personajes","q":"¿Quién reprocha a las mujeres de la familia que no le hicieran caso cuando Gregor sale del cuarto?","o":["El padre","La madre","Grete","La asistenta"],"a":0,"w":"El padre dice que lo esperaba y que las mujeres no le escuchaban."},{"id":"m134","cat":"Personajes","q":"¿Qué miembro de la familia insiste en ver a Gregor aunque se lo impiden?","o":["La madre","El padre","Grete","La criada"],"a":0,"w":"Los demás la retienen, pero la madre clama por ver a su hijo desgraciado."},{"id":"m135","cat":"Personajes","q":"¿Qué personaje no siente asco ni miedo ante Gregor?","o":["Grete","La madre","El padre","La asistenta"],"a":3,"w":"La asistenta no se asusta; lo trata con apelativos supuestamente cariñosos."},{"id":"m136","cat":"Personajes","q":"¿Cómo se comporta el padre cuando su mujer y su hija intentan llevarlo a la cama?","o":["Se acuesta enseguida y sin protestar nada","Les pega para que lo dejen tranquilo en el sillón","Se resiste y se queja de su poca paz en la vejez","Se duerme en el suelo para no moverse más"],"a":2,"w":"El padre se hace de rogar y exclama algo así como que esa es la paz que tiene en su vejez."},{"id":"m137","cat":"Personajes","q":"¿Cómo veían antes los padres a Grete?","o":["Como la hija perfecta de la familia","Como una chica algo inútil, aunque luego la valoran","Como una niña caprichosa e insoportable","Como la principal fuente de ingresos del hogar"],"a":1,"w":"Los padres antes se molestaban con Grete, pero luego valoran todo lo que hace por Gregor."},{"id":"m138","cat":"Personajes","q":"¿Qué personaje no permite que nadie más limpie el cuarto de Gregor?","o":["La madre","La asistenta","Grete","El padre"],"a":2,"w":"Grete se vuelve muy susceptible y quiere ocuparse en exclusiva de la limpieza."},{"id":"m139","cat":"Personajes","q":"¿Con qué miembro de la familia mantenía Gregor una relación más cercana?","o":["Con su padre, el señor Samsa","Con su madre, la señora Samsa","Con su hermana Grete","Con la criada de la casa"],"a":2,"w":"Gregor decía que solo seguía unido a su hermana, a la que quería pagar el conservatorio."},{"id":"m140","cat":"Personajes","q":"¿Qué personaje cree al principio que Gregor está simplemente enfermo?","o":["El padre","El apoderado","La madre","La criada"],"a":2,"w":"La madre insiste ante el apoderado en que Gregor está enfermo y por eso ha perdido el tren."},{"id":"m141","cat":"Personajes","q":"¿Cómo aparece el jefe de Gregor en la novela?","o":["Visita a la familia y habla con Gregor","Es uno de los tres huéspedes del piso","Nunca aparece en persona: solo se habla de él","Acude al entierro de Gregor y da el pésame"],"a":2,"w":"El jefe solo existe a través de los comentarios de Gregor y del apoderado; quien viene a casa es el apoderado."},{"id":"m142","cat":"Personajes","q":"¿Qué personaje piensa desde el primer día que hay que ser siempre muy estricto con Gregor?","o":["La madre","El padre","Grete","La asistenta"],"a":1,"w":"Gregor sabe desde su primer día como insecto que su padre cree necesario ser muy duro con él."},{"id":"m143","cat":"Objetos y espacios","q":"¿Qué muestra la imagen que Gregor tiene colgada en su cuarto?","o":["Una dama con sombrero, boa y manguito de pieles","Un paisaje nevado con una casa al fondo","Un retrato de su madre de joven","Un barco de vela en medio del mar"],"a":0,"w":"El cuadro que Gregor cuelga en su cuarto muestra a una dama con pieles que levanta un gran manguito."},{"id":"m144","cat":"Objetos y espacios","q":"¿De dónde procede el cuadro de la dama con pieles?","o":["Lo pintó su hermana Grete cuando era una niña","Lo recortó de una revista y lo enmarcó en dorado","Lo heredó de un abuelo que era pintor famoso","Lo compró en una subasta durante un viaje"],"a":1,"w":"Gregor había recortado la imagen de una revista y la puso en un bonito marco dorado."},{"id":"m145","cat":"Objetos y espacios","q":"¿Qué muestra una fotografía de Gregor que tiene la familia en casa?","o":["A su padre con el uniforme del banco","A Grete tocando el violín de niña","A Gregor de niño con su madre y su hermana","A Gregor, de joven teniente, con su sable"],"a":3,"w":"Es una foto de Gregor como joven teniente, con la mano en el sable."},{"id":"m146","cat":"Objetos y espacios","q":"¿Qué ocurre con la manzana que queda clavada en la espalda de Gregor?","o":["Sana por completo con el tiempo y desaparece","Se pudre y se inflama, y agrava su debilidad","Le sirve de alimento durante varias semanas","Grete la retira con cuidado una noche"],"a":1,"w":"La manzana se vuelve podrida y la herida alrededor se inflama."},{"id":"m147","cat":"Objetos y espacios","q":"¿Qué mueble quiere Grete dejar en el cuarto de Gregor al vaciarlo?","o":["El escritorio","La cómoda","El sofá","La cama"],"a":2,"w":"Grete quiere sacar todos los muebles menos el sofá, que es el escondite de Gregor."},{"id":"m148","cat":"Objetos y espacios","q":"¿Qué hace Grete con la puerta de la habitación de Gregor justo antes de su muerte?","o":["La deja entreabierta","La abre de par en par","La clava con tablas","La cierra con llave"],"a":3,"w":"Grete cierra con llave la puerta tras el regreso de Gregor, y dice «¡por fin!»."},{"id":"m149","cat":"Parte III","q":"¿Qué piensa Gregor al ver cenar a los huéspedes en el salón?","o":["Que él tiene hambre, pero no de esa clase de comida","Que le gustaría sentarse a cenar con ellos","Que los huéspedes comen mucho mejor que su familia","Que debería cambiar su comida por la de ellos"],"a":0,"w":"Mientras oye mascar a los huéspedes, Gregor piensa que tiene apetito, pero no de esas cosas: su cuerpo de insecto ya no tolera la comida humana."},{"id":"m150","cat":"Objetos y espacios","q":"Desde la ventana del cuarto de Gregor, ¿qué edificio ve al otro lado de la calle?","o":["Una iglesia","Una estación de tren","Un hospital","Una fábrica"],"a":2,"w":"Gregor veía el hospital de enfrente, que antes detestaba; luego deja de distinguirlo."},{"id":"m151","cat":"Objetos y espacios","q":"¿Qué objeto hace que Gregor tome conciencia de que ha dormido demasiado?","o":["El teléfono","El despertador","La campana de la iglesia","El reloj de su padre"],"a":1,"w":"El despertador marca ya casi las siete menos cuarto, hora muy tardía para el tren."},{"id":"m152","cat":"Objetos y espacios","q":"¿Qué hay sobre la mesa del cuarto de Gregor cuando se despierta?","o":["Libros de cuentas","Un violín","Un muestrario de telas","Un plato de comida"],"a":2,"w":"Sobre la mesa hay un muestrario de telas, herramienta de su trabajo de viajante."},{"id":"m153","cat":"Objetos y espacios","q":"¿Qué hace Gregor muchas noches sobre el sofá de cuero?","o":["Duerme profundamente toda la noche","Lee el periódico a la luz de la luna","Pasa horas arañando el cuero","Escribe cartas largas a su hermana"],"a":2,"w":"Gregor pasa las noches arañando el cuero del sofá por la ansiedad y la vergüenza."},{"id":"m154","cat":"Objetos y espacios","q":"¿Qué se amontona en el cuarto de Gregor en la tercera parte?","o":["Las maletas y baúles de los tres huéspedes","Las joyas de la familia que no habían vendido","Los instrumentos y herramientas de trabajo del padre","Trastos que no caben en el piso y los cubos de basura"],"a":3,"w":"Trastos y cubos de la cocina acaban en el cuarto, y Gregor acaba moviéndolos incluso con cierto gusto."},{"id":"m155","cat":"Temas y simbolismo","q":"¿Qué refleja la transformación de Gregor, según la interpretación más habitual?","o":["Un castigo divino por haber robado dinero al jefe","Un hechizo lanzado por un brujo contra la familia","El resultado de un experimento científico fallido","La sensación de ser un extraño, rechazado por los suyos"],"a":3,"w":"La lectura más habitual ve en Gregor la alienación del individuo, que se siente extraño y es rechazado."},{"id":"m156","cat":"Temas y simbolismo","q":"¿Qué crítica social se suele ver en la novela a través de Gregor?","o":["Que el trabajador vale lo que produce y se le abandona","Que los viajantes cobran sueldos demasiado altos","Que en la ciudad se trabaja mejor que en el campo","Que las empresas pagan siempre bien a sus empleados"],"a":0,"w":"Cuando Gregor deja de aportar dinero, la familia lo convierte en un estorbo."},{"id":"m157","cat":"Temas y simbolismo","q":"¿Qué sugiere que Gregor se preocupe por el tren aun transformado en insecto?","o":["Que no entiende nada de lo que le ha pasado","Que el trabajo ocupa por completo su vida e identidad","Que disfruta mucho de su trabajo y no quiere dejarlo","Que su jefe es su mejor amigo desde hace años"],"a":1,"w":"Gregor piensa en el trabajo antes que en su cambio: es la clave de su vida."},{"id":"m158","cat":"Temas y simbolismo","q":"¿Qué muestra el comportamiento de la familia respecto al cariño hacia Gregor?","o":["Que el cariño de la familia es siempre incondicional","Que todos se unen para tratar de curarlo","Que el afecto dependía en parte de su utilidad económica","Que se resignan por motivos religiosos y morales"],"a":2,"w":"La familia se acostumbró al dinero de Gregor y, al perder su sueldo, lo trata como una carga."},{"id":"m159","cat":"Temas y simbolismo","q":"¿Qué sentimiento hace sufrir a Gregor ante su familia, aun transformado?","o":["Orgullo por su aspecto y por su fuerza","Rencor hacia su hermana por haberlo encerrado","Culpa y vergüenza por ser una carga","Envidia de su padre por haber vuelto a trabajar"],"a":2,"w":"Gregor se siente culpable de las penurias de la familia y se avergüenza."},{"id":"m160","cat":"Temas y simbolismo","q":"¿Qué ejemplo de incomunicación aparece en la novela?","o":["Nadie habla en la casa durante toda la novela","Gregor entiende a su familia, pero no al revés","Gregor no entiende el alemán de su familia","Los huéspedes hablan otro idioma distinto"],"a":1,"w":"El lenguaje de Gregor se vuelve ininteligible: no puede decir ni siquiera «gracias» a su hermana."},{"id":"m161","cat":"Temas y simbolismo","q":"Cuando Grete dice que aquello no puede ser Gregor, ¿qué idea se refleja?","o":["Que ha confundido a Gregor con un animal cualquiera","Que Gregor nunca fue de verdad su hermano","Que han dejado de verlo como persona y hermano","Que quiere que Gregor se case con una amiga"],"a":2,"w":"Grete niega que el insecto sea su hermano, por lo que le quita su identidad y su condición de persona."},{"id":"m162","cat":"Temas y simbolismo","q":"¿Qué detalle muestra que la familia trata a Gregor como un animal?","o":["Le visten con ropa de domingo para comer con ellos","Le sientan a la mesa con ellos en el salón de casa","Le dejan la comida en un periódico y la barren con escoba","Le piden su opinión sobre los planes de la familia"],"a":2,"w":"Gregor es tratado como un animal indeseado y no como un miembro de la familia."},{"id":"m163","cat":"Temas y simbolismo","q":"¿Por qué se asocia la novela con el absurdo?","o":["Porque tiene mucho humor ligero y finales muy felices","Porque se desarrolla en un futuro lejano e imaginario","Porque trata de viajes espaciales y de máquinas raras","Porque pasa algo imposible, no se explica y todos lo aceptan"],"a":3,"w":"La transformación nunca se explica y la vida diaria sigue adelante, lo cual produce una sensación absurda."},{"id":"m164","cat":"Temas y simbolismo","q":"¿Qué rasgo del mundo laboral muestra la visita del apoderado?","o":["Un trato amable y comprensivo hacia el empleado","Un reparto justo de los salarios entre todos","Una confianza total en los empleados de la casa","La vigilancia y desconfianza hacia el empleado"],"a":3,"w":"El apoderado ve en la ausencia de Gregor una falta grave, incluso sospecha de dinero, y amenaza su puesto."},{"id":"m165","cat":"Temas y simbolismo","q":"Desde una lectura social, ¿qué clase de familia retratan los Samsa?","o":["Una familia aristócrata, muy rica y poderosa","Unos campesinos sin tierra que viven del campo","Unos grandes empresarios de Praga con fábricas","Una familia de clase media modesta y con deudas"],"a":3,"w":"Los Samsa tienen piso y criada, pero viven con deudas y apuros de dinero, y cuidan mucho las apariencias ante los demás."},{"id":"m166","cat":"Temas y simbolismo","q":"Una interpretación psicológica habitual ve en el insecto…","o":["La inferioridad e inutilidad de Gregor, ligada al padre","El deseo de Gregor de poder volar libre y feliz","Una enfermedad física real, rara y muy contagiosa","Un recuerdo infantil muy agradable de Gregor niño"],"a":0,"w":"Se relaciona con la sensación de Kafka de ser poca cosa ante su padre autoritario."},{"id":"m167","cat":"Temas y simbolismo","q":"¿Con qué aspecto de la vida de Kafka se relaciona a menudo el trato del padre a Gregor?","o":["Con su propia relación difícil con su padre","Con una pelea de Kafka con su jefe en la oficina","Con un viaje de Kafka a América","Con la estancia de Kafka en el ejército"],"a":0,"w":"El padre autoritario que castiga a Gregor se suele relacionar con el padre de Kafka, tema de la Carta al padre."},{"id":"m168","cat":"Temas y simbolismo","q":"¿Qué representa más claramente la manzana clavada en la espalda de Gregor, según la interpretación más habitual?","o":["La riqueza que tenía la familia antes de la ruina","La amistad de Gregor con el apoderado de la empresa","La salud que Gregor recupera poco a poco al final","La herida y el rechazo del padre, siempre visibles"],"a":3,"w":"Es una herida visible que recuerda la violencia del padre y que acaba contribuyendo a su muerte."},{"id":"m169","cat":"Temas y simbolismo","q":"¿Qué sugiere que Gregor se sienta atraído por la música?","o":["Que ya es completamente un insecto, sin rastro de persona","Que conserva una sensibilidad humana, pese a su cuerpo de animal","Que a todos los de la casa les gusta la música","Que no entiende nada de lo que ocurre a su alrededor"],"a":1,"w":"Gregor se pregunta si es un animal, ya que la música le conmueve tanto."},{"id":"m170","cat":"Temas y simbolismo","q":"¿Qué simboliza que Gregor quede encerrado en su cuarto?","o":["Su aislamiento y su exclusión de la familia","Su deseo de descansar de tantos viajes de trabajo","Su amor por el orden y la limpieza de la casa","Su riqueza y su buena posición en la sociedad"],"a":0,"w":"La habitación cerrada muestra la soledad de Gregor, que ve a los demás por una rendija."},{"id":"m171","cat":"Temas y simbolismo","q":"¿Qué sentido tiene el paseo en tranvía de la familia al final?","o":["Muestra que lloran su pérdida durante meses","Muestra su alivio y una nueva vida, con ironía cruel","Muestra que se mudan para honrar la memoria de Gregor","Muestra que se arrepienten profundamente de lo hecho"],"a":1,"w":"Tras su muerte, la familia se siente liberada y mira con optimismo al futuro."},{"id":"m172","cat":"Temas y simbolismo","q":"¿Qué contraste hay entre el sacrificio de Gregor y el trato que recibe al final?","o":["Que nadie había valorado jamás su sueldo","Que se sacrificó por todos y acaba siendo un estorbo","Que siempre fue un egoísta que pensaba en sí mismo","Que sus padres lo mantuvieron siempre a él"],"a":1,"w":"Gregor sostuvo económicamente a todos y, al enfermar, lo ven como una carga."},{"id":"m173","cat":"Temas y simbolismo","q":"¿Qué muestra la actitud de la familia con los huéspedes?","o":["Que anteponen las apariencias y el dinero a Gregor","Un sincero cariño hacia Gregor y su situación","Que los huéspedes les caen fatal desde el principio","Que son ricos y no necesitan el dinero del alquiler"],"a":0,"w":"Los padres sirven a los huéspedes con servilismo, necesitados de ingresos, y esconden a Gregor."},{"id":"m174","cat":"Temas y simbolismo","q":"¿Qué cambio positivo se aprecia en la familia a medida que Gregor se deteriora?","o":["Dejan de trabajar y viven de los ahorros","Todos trabajan y se vuelven activos e independientes","Se hacen ricos sin esfuerzo alguno","Se separan y cada uno vive en una ciudad distinta"],"a":1,"w":"Padre, madre y hermana trabajan y salen adelante; en cierto modo, la familia «renace» mientras Gregor decae."},{"id":"m175","cat":"Temas y simbolismo","q":"¿Qué papel cumplen los tres huéspedes en la historia?","o":["Ayudan a Grete a cuidar de Gregor cada día","Defienden a Gregor ante su padre en una discusión","Descubren a Gregor y desencadenan la crisis final","Son amigos de Gregor desde la infancia"],"a":2,"w":"La mirada de los huéspedes, que descubren a Gregor, desencadena el discurso de Grete."},{"id":"m176","cat":"Temas y simbolismo","q":"Una lectura habitual del título «La metamorfosis» entiende que…","o":["Solo cambia el apoderado, que se vuelve amable con todos","Solo cambia el tiempo, de invierno a primavera","Gregor cambia en el cuerpo y la familia en su actitud","Nadie cambia, pues todos siguen igual que antes"],"a":2,"w":"No cambia solo Gregor: la familia pasa de la dependencia a la actividad y la esperanza."},{"id":"m177","cat":"Temas y simbolismo","q":"¿Qué dice sobre la vida de Gregor que se queje de no poder hacer amistades?","o":["Que era una persona muy sociable y alegre","Que tenía muchos amigos en cada ciudad","Que vivía en el extranjero lejos de su familia","Que su vida de viajante ya lo aislaba de todos"],"a":3,"w":"Antes de la transformación Gregor ya vivía solo con su trabajo, sin relaciones estables."},{"id":"m178","cat":"Temas y simbolismo","q":"¿Cuál de estas lecturas es una interpretación habitual de la novela?","o":["Una crónica real de un viaje de negocios","Una metáfora de la alienación en la sociedad moderna","Una novela de aventuras con mucho humor","Un tratado científico sobre zoología y entomología"],"a":1,"w":"La transformación se interpreta como imagen de la soledad y el extrañamiento del ser humano."},{"id":"m179","cat":"Narrador, estructura y estilo","q":"¿Quién cuenta la historia de La metamorfosis?","o":["Gregor, en primera persona","Un narrador en tercera persona","Grete, en primera persona","El padre, en primera persona"],"a":1,"w":"La historia está contada por un narrador externo que habla de «Gregor» y no de «yo»."},{"id":"m180","cat":"Narrador, estructura y estilo","q":"¿Desde qué punto de vista se narra casi toda la historia?","o":["Desde lo que ve, siente y piensa Gregor","Desde la visión de su hermana Grete","Desde la del apoderado de la empresa","Desde la de la policía que investiga"],"a":0,"w":"El narrador sigue a Gregor y conocemos sus pensamientos, aunque no habla en primera persona."},{"id":"m181","cat":"Narrador, estructura y estilo","q":"¿Qué cambia en la narración tras la muerte de Gregor?","o":["Se centra en la familia, pues Gregor ha muerto","Pasa a ser un relato en primera persona","Se cuenta a partir de entonces en presente","Aparece un nuevo narrador que juzga a la familia"],"a":0,"w":"En el último fragmento, sin Gregor, el relato sigue a sus padres y a Grete."},{"id":"m182","cat":"Narrador, estructura y estilo","q":"¿Cómo cuenta el narrador el hecho fantástico de la transformación?","o":["Con un tono de misterio y de terror absoluto","Con tono objetivo y sereno, como algo normal","Con humor, chistes y bromas de forma continua","Con un tono de cuento de hadas muy ligero"],"a":1,"w":"El narrador no se sorprende y expone la transformación con calma, lo cual aumenta la sensación de absurdo."},{"id":"m183","cat":"Narrador, estructura y estilo","q":"¿Cómo comienza la novela?","o":["Con la transformación ya ocurrida, sin explicarla","Con la infancia de Gregor y sus primeros años","Con la presentación de toda la familia en la mesa","Con un sueño que solo se aclara al final"],"a":0,"w":"La primera frase ya cuenta que Gregor se ha transformado; es un comienzo «in medias res»."},{"id":"m184","cat":"Narrador, estructura y estilo","q":"¿Qué se explica en la novela sobre la causa de la transformación?","o":["Que fue una maldición de un enemigo del padre","Nada: nunca se sabe por qué ocurre","Que fue una enfermedad contagiosa de la ciudad","Que fue el resultado de un experimento médico"],"a":1,"w":"Kafka no explica la causa; el lector solo ve las consecuencias."},{"id":"m185","cat":"Narrador, estructura y estilo","q":"¿Cómo es el lenguaje de la novela?","o":["Claro y sencillo, con frases precisas","Muy poético y lleno de metáforas complicadas","Lleno de jerga militar y de términos técnicos","Escrito en verso, con rima y con ritmo"],"a":0,"w":"El estilo es sobrio y exacto, y contrasta con lo extraordinario de lo narrado."},{"id":"m186","cat":"Narrador, estructura y estilo","q":"¿Qué resume mejor lo que ocurre en cada una de las tres partes?","o":["I: infancia de Gregor; II: viaje de negocios; III: juicio y condena","I: boda de Grete; II: mudanza de la familia; III: regreso a Praga","I: transformación y apoderado; II: encierro y manzanas; III: huéspedes y muerte","I: muerte de Gregor; II: el funeral; III: reparto de la herencia"],"a":2,"w":"Cada parte avanza en el deterioro de Gregor: la visita del apoderado, el golpe de las manzanas y la muerte."},{"id":"m187","cat":"Narrador, estructura y estilo","q":"¿Qué efecto produce el contraste entre lo extraordinario y las preocupaciones cotidianas, como los trenes o el dinero?","o":["Un tono épico, propio de las grandes hazañas","Un efecto irónico y absurdo, cómico y angustioso","Una sensación de sueño feliz y de calma","Un terror sobrenatural muy intenso"],"a":1,"w":"Que Gregor se preocupe del tren mientras es un insecto resulta absurdo y cómico, pero también triste."},{"id":"m188","cat":"Narrador, estructura y estilo","q":"¿Dónde transcurre casi toda la acción?","o":["En el piso de la familia, sobre todo en su cuarto","En una estación de tren de la ciudad vieja","En el campo, en casa de unos parientes lejanos","En la oficina donde trabaja Gregor, con el jefe"],"a":0,"w":"Casi todo sucede en el piso, un espacio cerrado que subraya el encierro de Gregor."},{"id":"m189","cat":"Narrador, estructura y estilo","q":"¿Cuánto tiempo transcurre aproximadamente desde la transformación hasta la muerte de Gregor?","o":["Una sola noche","Unas horas","Varios meses","Más de diez años"],"a":2,"w":"Pasan semanas y meses: Gregor menciona que Navidad ya había pasado y al final se llega a fines de marzo."},{"id":"m190","cat":"Narrador, estructura y estilo","q":"¿Cómo es el final de la novela?","o":["Abierto: Gregor desaparece sin que nadie sepa nada","Feliz: Gregor vuelve a ser humano y se cura","Sorpresa: se descubre que todo era un sueño","Cerrado para Gregor, con nota irónica sobre la familia"],"a":3,"w":"Gregor muere y la familia, aliviada, planea su futuro; el final resulta irónico."},{"id":"m191","cat":"Narrador, estructura y estilo","q":"¿Qué descarta enseguida el narrador respecto a la transformación de Gregor?","o":["Que sea contagiosa","Que sea temporal","Que sea un sueño","Que sea un castigo"],"a":2,"w":"Tras la primera frase se dice «no era un sueño»."},{"id":"m192","cat":"Narrador, estructura y estilo","q":"¿Cómo se describe el aspecto exacto del insecto en que se convierte Gregor?","o":["Con una descripción científica y detallada","Con un dibujo hecho por el propio autor","Se dice claramente que es una cucaracha","Solo con detalles sueltos, sin precisarlo"],"a":3,"w":"Se mencionan el caparazón, el vientre y las patas, pero nunca se concreta qué animal es."},{"id":"m193","cat":"Vocabulario y comprensión","q":"En la novela, ¿qué es un apoderado, como el que visita a Gregor?","o":["Un abogado defensor que actúa en un juicio","Alguien con poder para representar a una empresa","Un criado de confianza que sirve en una casa","Un cobrador que trabaja para un banco"],"a":1,"w":"El apoderado actúa en nombre de la empresa."},{"id":"m194","cat":"Vocabulario y comprensión","q":"¿Qué significa la palabra «metamorfosis»?","o":["Un viaje largo que se hace en tren","Transformación de algo en otra cosa","Una enfermedad grave que afecta a los huesos","Un acuerdo comercial entre dos empresas"],"a":1,"w":"Del griego, significa cambio de forma; da título a la obra."},{"id":"m195","cat":"Vocabulario y comprensión","q":"¿Qué significa «alienación», palabra que se usa para hablar de la novela?","o":["Estar de acuerdo con todo el mundo y no discutir","Tener mucha energía y ganas de trabajar","Sentirse ajeno o extraño a uno mismo y a los demás","Hablar con facilidad una lengua extranjera"],"a":2,"w":"Gregor se siente extraño a su vida y a su familia."},{"id":"m196","cat":"Vocabulario y comprensión","q":"¿Qué significa que una situación es «absurda»?","o":["Que es muy divertida y alegre","Que no tiene sentido ni lógica","Que es muy peligrosa para todos","Que es muy antigua y conocida"],"a":1,"w":"El absurdo describe lo contrario a lo razonable, como la transformación sin explicación de Gregor."},{"id":"m197","cat":"Vocabulario y comprensión","q":"¿Qué es un cerrajero, profesión a la que recurren los Samsa?","o":["Persona que vende pan en una panadería","Persona que repara relojes de pared y de pulsera","Persona que arregla zapatos y botas viejos","Persona que hace o arregla cerraduras y llaves"],"a":3,"w":"El padre manda llamar a un cerrajero para abrir la puerta de Gregor."},{"id":"m198","cat":"Vocabulario y comprensión","q":"¿Qué es un conservatorio, donde Gregor quería enviar a su hermana?","o":["Un centro donde se estudia música","Un lugar para guardar y cuidar plantas","Una residencia donde viven personas mayores","Un tribunal donde se dictan sentencias"],"a":0,"w":"Gregor quería pagar a Grete los estudios de música."},{"id":"m199","cat":"Vocabulario y comprensión","q":"¿Qué es la taquigrafía, que estudia Grete?","o":["Una técnica de pintura con pinceles finos","Escritura rápida con signos especiales","Un idioma extranjero que se habla en Europa","El arte de coser prendas y bordarlas"],"a":1,"w":"Grete aprende taquigrafía para conseguir un puesto mejor."},{"id":"m200","cat":"Vocabulario y comprensión","q":"¿Qué es un huésped, como los tres que se alojan en el piso de los Samsa?","o":["Persona que trabaja como empleada en un hotel","Un familiar lejano que visita a la familia","Persona que se aloja en casa ajena y paga por ello","El dueño de un piso que lo alquila"],"a":2,"w":"Los tres huéspedes alquilan una habitación en el piso."}]};</script>
